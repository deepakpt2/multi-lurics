# Community Lyrics stack. Every site-specific value comes from deploy/.env —
# do not edit this file per server.
#
#   cp deploy/.env.example deploy/.env   # once, then edit
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Only `web` joins the Traefik network; it proxies /api/v1 to `api` internally.
# TLS terminates at Cloudflare (cloudflared), so Traefik routes plain HTTP.

x-server-build: &server-build
  context: ..
  dockerfile: Dockerfile

x-server-env: &server-env
  LYRICS_DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?set POSTGRES_DB}
  LYRICS_APP_BASE_URL: ${APP_PUBLIC_URL:?set APP_PUBLIC_URL}
  LYRICS_COOKIE_SECURE: ${COOKIE_SECURE:-true}
  LYRICS_SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-336}
  LYRICS_DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
  LYRICS_LOG_JSON: ${LOG_JSON:-1}
  LYRICS_AUTH_RATE_PER_MIN: ${AUTH_RATE_PER_MIN:-20}
  LYRICS_SEARCH_RATE_PER_MIN: ${SEARCH_RATE_PER_MIN:-120}
  LYRICS_METRICS_TOKEN: ${METRICS_TOKEN:-}
  LYRICS_HOME_REFRESH_SECS: ${HOME_REFRESH_SECS:-3600}
  LYRICS_MEDIA_DIR: /data/media
  LYRICS_MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-5242880}
  LYRICS_MEDIA_MAX_SIDE: ${MEDIA_MAX_SIDE:-8000}
  LYRICS_MEDIA_SIZES: ${MEDIA_SIZES:-96,240,640}
  LYRICS_ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  LYRICS_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  LYRICS_ADMIN_NAME: ${ADMIN_NAME:-}
  LYRICS_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  LYRICS_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  LYRICS_SMTP_URL: ${SMTP_URL:-}
  LYRICS_MAIL_FROM: ${MAIL_FROM:-}
  RUST_LOG: ${RUST_LOG:-info,sqlx=warn}

services:
  db:
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: applies pending forward-only migrations, then exits. api waits for it.
  migrate:
    build: *server-build
    image: ${IMAGE_PREFIX:-community-lyrics}-server:${IMAGE_TAG:-latest}
    command: ["lyrics-api", "migrate"]
    environment: *server-env
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]
    restart: "no"

  api:
    build: *server-build
    image: ${IMAGE_PREFIX:-community-lyrics}-server:${IMAGE_TAG:-latest}
    command: ["lyrics-api", "serve"]
    restart: unless-stopped
    environment:
      <<: *server-env
      LYRICS_BIND_ADDR: 0.0.0.0:8787
    volumes:
      - media:/data/media
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  worker:
    build: *server-build
    image: ${IMAGE_PREFIX:-community-lyrics}-server:${IMAGE_TAG:-latest}
    command: ["lyrics-worker"]
    restart: unless-stopped
    environment:
      <<: *server-env
      # Set MAILBOX_DIR=/data/mailbox to keep emails as files (alternative to SMTP_URL).
      LYRICS_DEV_MAILBOX_DIR: ${MAILBOX_DIR:-}
      # With REVALIDATE_SECRET set, the worker tells web to drop cached pages when content or URLs change.
      LYRICS_REVALIDATE_URL: ${REVALIDATE_SECRET:+http://web:3000/api/revalidate}
      LYRICS_REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    volumes:
      - mailbox:/data/mailbox
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal]

  web:
    build:
      context: ../web
      args:
        API_ORIGIN: http://api:8787
    image: ${IMAGE_PREFIX:-community-lyrics}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Canonical URLs, hreflang and sitemaps are built from this.
      SITE_URL: ${APP_PUBLIC_URL:?set APP_PUBLIC_URL}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    depends_on:
      api: { condition: service_healthy }
    networks: [internal, proxy]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/en"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK:-proxy}
      - traefik.http.routers.${TRAEFIK_ROUTER:-lyrics}.rule=Host(`${APP_DOMAIN:?set APP_DOMAIN}`)
      - traefik.http.routers.${TRAEFIK_ROUTER:-lyrics}.entrypoints=${TRAEFIK_ENTRYPOINT:-web}
      - traefik.http.routers.${TRAEFIK_ROUTER:-lyrics}.service=${TRAEFIK_ROUTER:-lyrics}
      - traefik.http.services.${TRAEFIK_ROUTER:-lyrics}.loadbalancer.server.port=3000

networks:
  internal: {}
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}

volumes:
  db-data:
  mailbox:
  media:
