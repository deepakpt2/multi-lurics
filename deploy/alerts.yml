# Prometheus alert rules for the metrics the API exposes at /metrics. Every alert names what to do:
# see docs/operations.md, "Incident runbook", for the section in the annotation.
groups:
  - name: lyrics
    rules:
      - alert: ApiDown
        expr: up{job="lyrics-api"} == 0
        for: 2m
        labels: { severity: page }
        annotations: { summary: "API is not scraping", runbook: "docs/operations.md#api-down" }
      - alert: DatabaseUnreachable
        expr: lyrics_up_database == 0
        for: 1m
        labels: { severity: page }
        annotations: { summary: "API cannot reach Postgres", runbook: "docs/operations.md#database-unreachable" }
      - alert: HighServerErrorRate
        expr: |
          sum(rate(lyrics_http_request_duration_seconds_count{status=~"5.."}[5m]))
            / sum(rate(lyrics_http_request_duration_seconds_count[5m])) > 0.02
        for: 5m
        labels: { severity: page }
        annotations: { summary: "More than 2% of requests fail with 5xx", runbook: "docs/operations.md#elevated-5xx" }
      - alert: SlowPublicReads
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(lyrics_http_request_duration_seconds_bucket{method="GET",route=~"/api/v1/(contributions|recordings|search).*"}[5m]))) > 0.3
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "Public read p95 above 300 ms (SLO: 150 ms)", runbook: "docs/operations.md#slow-reads" }
      - alert: OutboxBacklog
        expr: lyrics_outbox_oldest_pending_seconds > 300
        for: 5m
        labels: { severity: page }
        annotations: { summary: "Oldest outbox event waiting over 5 minutes: worker down or stuck", runbook: "docs/operations.md#outbox-backlog" }
      - alert: OutboxRetrying
        expr: lyrics_outbox_retrying > 10
        for: 15m
        labels: { severity: ticket }
        annotations: { summary: "Events are failing and being retried", runbook: "docs/operations.md#outbox-backlog" }
      - alert: DbPoolSaturated
        expr: lyrics_db_pool_connections{state="idle"} == 0 and lyrics_db_pool_connections{state="total"} > 0
        for: 5m
        labels: { severity: ticket }
        annotations: { summary: "No idle database connections for 5 minutes", runbook: "docs/operations.md#slow-reads" }
      - alert: RateLimitedSpike
        expr: sum(rate(lyrics_http_request_duration_seconds_count{status="429"}[5m])) > 5
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "Sustained 429s: abuse or a limit set too low", runbook: "docs/operations.md#abuse" }
